<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H.PLACE 재고 관리</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">H.</span>
    <span class="brand-name">PLACE <em>재고 관리</em></span>
  </div>
  <label class="branch-pick">
    <span>지점</span>
    <select id="branchFilter"></select>
  </label>
</header>

<nav class="tabs" id="tabs">
  <button data-view="dashboard" class="on">대시보드</button>
  <button data-view="stock">재고 현황</button>
  <button data-view="move">입출고 등록</button>
  <button data-view="products">품목 관리</button>
  <button data-view="history">거래 내역</button>
  <button data-view="settings">설정</button>
</nav>

<main>

  <!-- 대시보드 -->
  <section class="view on" id="view-dashboard">
    <div class="kpis" id="kpis"></div>
    <div class="grid-2">
      <div class="card">
        <div class="card-head"><h2>부족 재고</h2><span class="muted" id="lowCount"></span></div>
        <div id="lowList"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>최근 입출고</h2></div>
        <div id="recentList"></div>
      </div>
    </div>
  </section>

  <!-- 재고 현황 -->
  <section class="view" id="view-stock">
    <div class="toolbar">
      <input type="search" id="stockSearch" placeholder="품목명 · 코드 · 거래처 검색">
      <select id="stockCategory"></select>
      <label class="check"><input type="checkbox" id="stockLowOnly"> 부족 재고만</label>
    </div>
    <div class="card flush"><div class="table-wrap"><table id="stockTable"></table></div></div>
  </section>

  <!-- 입출고 등록 -->
  <section class="view" id="view-move">
    <div class="card narrow">
      <h2>입출고 등록</h2>
      <form id="moveForm" class="form">
        <div class="seg" id="moveType">
          <button type="button" data-type="in" class="on">입고</button>
          <button type="button" data-type="out">출고 · 사용</button>
          <button type="button" data-type="transfer">지점 이동</button>
          <button type="button" data-type="adjust">실사 조정</button>
        </div>
        <label>지점<select id="moveBranch" required></select></label>
        <label id="moveToWrap" hidden>받는 지점<select id="moveTo"></select></label>
        <label>품목<select id="moveProduct" required></select></label>
        <p class="hint" id="moveStockHint"></p>
        <label><span id="moveQtyLabel">수량</span><input type="number" id="moveQty" min="0" step="1" required></label>
        <label>날짜<input type="date" id="moveDate" required></label>
        <label>메모<input type="text" id="moveNote" maxlength="100" placeholder="예: 로레알 발주분, 디자이너 김OO 사용"></label>
        <button type="submit" class="btn primary">저장</button>
      </form>
    </div>
  </section>

  <!-- 품목 관리 -->
  <section class="view" id="view-products">
    <div class="toolbar">
      <input type="search" id="productSearch" placeholder="품목 검색">
      <button class="btn primary" id="addProduct">+ 품목 추가</button>
    </div>
    <div class="card flush"><div class="table-wrap"><table id="productTable"></table></div></div>
  </section>

  <!-- 거래 내역 -->
  <section class="view" id="view-history">
    <div class="toolbar">
      <select id="histType">
        <option value="">전체 유형</option>
        <option value="in">입고</option>
        <option value="out">출고 · 사용</option>
        <option value="transfer">지점 이동</option>
        <option value="adjust">실사 조정</option>
      </select>
      <input type="date" id="histFrom" aria-label="시작일">
      <input type="date" id="histTo" aria-label="종료일">
      <button class="btn" id="exportCsv">CSV 내보내기</button>
    </div>
    <div class="card flush"><div class="table-wrap"><table id="histTable"></table></div></div>
  </section>

  <!-- 설정 -->
  <section class="view" id="view-settings">
    <div class="grid-2">
      <div class="card">
        <h2>지점 관리</h2>
        <ul class="list" id="branchList"></ul>
        <form id="branchForm" class="inline-form">
          <input type="text" id="branchName" placeholder="새 지점 이름" maxlength="30" required>
          <button class="btn primary">추가</button>
        </form>
      </div>
      <div class="card">
        <h2>데이터 백업</h2>
        <p class="muted">데이터는 지금 쓰는 브라우저에만 저장됩니다. 다른 컴퓨터로 옮기거나 브라우저 기록을 지우기 전에 꼭 백업하세요.</p>
        <div class="btn-row">
          <button class="btn" id="backup">백업 파일 받기</button>
          <label class="btn">복원하기<input type="file" id="restore" accept=".json" hidden></label>
        </div>
        <hr>
        <h2>초기화</h2>
        <p class="muted">모든 데이터를 지우고 예시 데이터로 다시 시작합니다.</p>
        <button class="btn danger" id="reset">예시 데이터로 초기화</button>
      </div>
    </div>
  </section>

</main>

<!-- 품목 추가 · 수정 창 -->
<dialog id="productDialog">
  <form method="dialog" id="productForm" class="form">
    <h2 id="productDialogTitle">품목 추가</h2>
    <label>품목 코드<input type="text" id="pSku" maxlength="30" required></label>
    <label>품목명<input type="text" id="pName" maxlength="60" required></label>
    <div class="row">
      <label>분류<select id="pCategory"></select></label>
      <label>단위<input type="text" id="pUnit" maxlength="10" placeholder="개, 통, 박스" required></label>
    </div>
    <div class="row">
      <label>최소 재고<input type="number" id="pMin" min="0" step="1" required></label>
      <label>단가 (원)<input type="number" id="pPrice" min="0" step="1"></label>
    </div>
    <label>거래처<input type="text" id="pSupplier" maxlength="40"></label>
    <div class="btn-row end">
      <button type="button" class="btn" id="productCancel">취소</button>
      <button type="submit" class="btn primary" value="save">저장</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
